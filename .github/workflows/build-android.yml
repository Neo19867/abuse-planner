name: Build Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android-app assembleDebug
      - name: Prepare APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk shift-coef-planner-v2.1.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shift-coef-planner-v2.1.5
          path: shift-coef-planner-v2.1.5.apk
          if-no-files-found: error
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v2.1.5 >/dev/null 2>&1; then
            gh release upload android-v2.1.5 shift-coef-planner-v2.1.5.apk --clobber
          else
            gh release create android-v2.1.5 shift-coef-planner-v2.1.5.apk \
              --target "$GITHUB_SHA" \
              --title "Android v2.1.5" \
              --notes "Android-приложение калькулятора смен и коэффициента."
          fi
