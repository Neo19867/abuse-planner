plugins {
    id "com.android.application"
}

android {
    namespace "com.neo.shiftplanner"
    compileSdk 35

    defaultConfig {
        applicationId "com.neo.shiftplanner"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "2.1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
